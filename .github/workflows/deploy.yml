name: Deploy domestic site

on:
  push:
    branches:
      - main
    paths:
      - 'p1/**'
      - 'p2-probe/**'
      - 'p2-bridge/**'
      - 'src/**'
      - 'build.mjs'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /var/www/nioengine.cn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all apps for domestic deployment
        env:
          P1_ICP: 沪ICP备2026059246号
        run: npm run build:all

      - name: Verify domestic artifacts
        shell: bash
        run: |
          test -f public/index.html
          test -f public/engine-worklet.js
          test -f public/p0/index.html
          test -f public/sensors/index.html
          test -f public/bridge/index.html
          grep -q '沪ICP备2026059246号' public/index.html

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy all apps to remote nginx docroot
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            public/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
